 case &#x27;events&#x27;:html=`&lt;div class=&quot;panelCard&quot;&gt;&lt;h3&gt;WINTER EVENT&lt;/h3&gt;${caseArt(5)}&lt;p&gt;Открой 5 любых кейсов и получи INFINITY бесплатно. Прогресс: ${Math.min(state.opens,5)} / 5.&lt;/p&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;claimEvent()&quot; ${state.event||state.opens&lt;5?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;${state.event?&#x27;НАГРАДА ПОЛУЧЕНА&#x27;:&#x27;ПОЛУЧИТЬ ПРЕДМЕТ&#x27;}&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;notice&quot;&gt;Демонстрационное событие без календарного ограничения.&lt;/p&gt;`;break;
 case &#x27;profile&#x27;:html=`&lt;label class=&quot;field&quot;&gt;Имя&lt;input id=&quot;nameInput&quot; value=&quot;${esc(state.name)}&quot; maxlength=&quot;20&quot;&gt;&lt;/label&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;saveName()&quot;&gt;СОХРАНИТЬ&lt;/button&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;panelCard&quot;&gt;&lt;h3&gt;${state.inv.length} предметов&lt;/h3&gt;&lt;p&gt;Открыто кейсов: ${state.opens}&lt;br&gt;Побед: ${state.wins}&lt;br&gt;Баттлов: ${state.battles.length}&lt;/p&gt;&lt;button class=&quot;btn&quot; onclick=&quot;showPanel(&#x27;inventory&#x27;)&quot;&gt;ИНВЕНТАРЬ&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;panelCard&quot;&gt;&lt;h3&gt;${fmt(state.coins)} монет&lt;/h3&gt;&lt;p&gt;${fmt(state.gems)} кристаллов&lt;/p&gt;&lt;button class=&quot;btn&quot; onclick=&quot;showPanel(&#x27;shop&#x27;)&quot;&gt;ПОПОЛНИТЬ&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;break;
 case &#x27;notifications&#x27;:html=`&lt;div class=&quot;panelCard&quot;&gt;&lt;h3&gt;Добро пожаловать в CASE CLASH&lt;/h3&gt;&lt;p&gt;Забери ежедневные 100 монет и открой первый кейс.&lt;/p&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;dailyReward()&quot;&gt;ЗАБРАТЬ НАГРАДУ&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;panelCard&quot;&gt;&lt;h3&gt;Твоя активность&lt;/h3&gt;&lt;p&gt;Открыто ${state.opens} кейсов. В инвентаре ${state.inv.length} предметов.&lt;/p&gt;&lt;button class=&quot;btn&quot; onclick=&quot;showPanel(&#x27;tasks&#x27;)&quot;&gt;ПРОВЕРИТЬ ЗАДАНИЯ&lt;/button&gt;&lt;/div&gt;`;break;
 case &#x27;terms&#x27;:html=&#x27;&lt;p&gt;CASE CLASH — бесплатная интерактивная демоверсия. Все балансы и предметы виртуальные. Денежных ставок, покупок, продажи предметов и вывода средств нет. Показанные рублёвые значения — иллюстративные подписи референса, а не рыночные предложения.&lt;/p&gt;&lt;p&gt;Баттлы проходят против демо-ботов. Реклама симулируется. Статистика главной страницы демонстрационная.&lt;/p&gt;&#x27;;break;
 case &#x27;privacy&#x27;:html=&#x27;&lt;p&gt;Имя, баланс, предметы, задания и черновики обращений сохраняются в localStorage этого браузера. Серверная регистрация и отправка обращений отсутствуют. Очистка данных сайта удалит локальный прогресс.&lt;/p&gt;&#x27;;break;
 case &#x27;language&#x27;:html=&#x27;&lt;p&gt;Интерфейс демоверсии доступен на русском. Названия кейсов и предметов сохранены на английском.&lt;/p&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;closeModal()&quot;&gt;РУССКИЙ · ВЫБРАН&lt;/button&gt;&#x27;;break;
 }
 openModal(title,html,type);
}
function empty(){return &#x27;&lt;div class=&quot;empty&quot;&gt;Инвентарь пуст.&lt;br&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;openCase(\&#x27;STARTER\&#x27;,0)&quot;&gt;ОТКРЫТЬ БЕСПЛАТНЫЙ КЕЙС&lt;/button&gt;&lt;/div&gt;&#x27;;}
function toggleItem(id,on){if(on)chosen.add(id);else chosen.delete(id);$(&#x27;#selectionAction&#x27;).disabled=chosen.size!==(currentPanel===&#x27;upgrade&#x27;?1:3);}
function upgradeSelected(){if(busy||chosen.size!==1)return;const id=[...chosen][0],ix=state.inv.findIndex(x=&gt;x.id===id);if(ix&lt;0)return;const source=state.inv[ix],better=skins.map((s,i)=&gt;i).filter(i=&gt;skins[i][3]&gt;skins[source.skin][3]);if(!better.length){toastMsg(&#x27;Это уже самый дорогой предмет&#x27;);return;}state.inv.splice(ix,1);const ok=Math.random()&lt;.5,target=better[Math.floor(Math.random()*better.length)];if(ok)state.inv.push(item(target));save();openModal(ok?&#x27;АПГРЕЙД УСПЕШЕН&#x27;:&#x27;АПГРЕЙД НЕ УДАЛСЯ&#x27;,`${ok?weapon(target):weapon(source.skin)}&lt;h3&gt;${ok?skins[target][0]+&#x27; · &#x27;+skins[target][1]:&#x27;Исходный предмет израсходован&#x27;}&lt;/h3&gt;&lt;p&gt;Шанс составлял 50%.&lt;/p&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;showPanel(&#x27;inventory&#x27;)&quot;&gt;ИНВЕНТАРЬ&lt;/button&gt;`,&#x27;result&#x27;);}
function contractSelected(){if(busy||chosen.size!==3)return;const ids=[...chosen];if(ids.some(id=&gt;!state.inv.some(x=&gt;x.id===id)))return;state.inv=state.inv.filter(x=&gt;!chosen.has(x.id));const won=pick();state.inv.push(item(won));save();openModal(&#x27;КОНТРАКТ ВЫПОЛНЕН&#x27;,`${weapon(won)}&lt;h3&gt;${skins[won][0]} · ${skins[won][1]}&lt;/h3&gt;&lt;p&gt;Три выбранных предмета обменены на один. Предмет сохранён.&lt;/p&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;showPanel(&#x27;inventory&#x27;)&quot;&gt;ИНВЕНТАРЬ&lt;/button&gt;`,&#x27;result&#x27;);}
function exchangeItem(id){const ix=state.inv.findIndex(x=&gt;x.id===id);if(ix&lt;0)return;const x=state.inv.splice(ix,1)[0];state.coins+=sellValue(x.skin);save();showPanel(&#x27;inventory&#x27;);toastMsg(&#x27;Предмет обменян на виртуальные монеты&#x27;);}
function addDemoCoins(){state.coins+=1000;save();showPanel(&#x27;shop&#x27;);toastMsg(&#x27;+1 000 демо-монет&#x27;);}
function convertGems(){if(state.gems&lt;100)return;state.gems-=100;state.coins+=100;save();showPanel(&#x27;shop&#x27;);}
function dailyReward(){if(busy)return;const today=new Date().toDateString();if(state.daily===today){toastMsg(&#x27;Сегодня награда уже получена&#x27;);return;}state.daily=today;state.coins+=100;save();toastMsg(&#x27;Ежедневная награда: +100 монет&#x27;);}
function claimTask(id){if(busy)return;const t={opens:[state.opens,3,50],wins:[state.wins,1,75],ads:[state.ads,1,25]}[id];if(!t)return;if(state.claims.includes(id)){toastMsg(&#x27;Награда уже получена&#x27;);return;}if(t[0]&lt;t[1]){showPanel(&#x27;tasks&#x27;);toastMsg(&#x27;Сначала выполни задание&#x27;);return;}state.claims.push(id);state.coins+=t[2];save();if(currentPanel===&#x27;tasks&#x27;)showPanel(&#x27;tasks&#x27;);toastMsg(`Задание выполнено: +${t[2]} монет`);}
function rewardAd(){if(busy)return;openModal(&#x27;РЕКЛАМНАЯ ПАУЗА&#x27;,`&lt;div class=&quot;empty&quot;&gt;&lt;h3&gt;CASE CLASH&lt;/h3&gt;&lt;p&gt;Это симуляция rewarded-рекламы.&lt;br&gt;Рекламная сеть не подключена.&lt;/p&gt;&lt;p id=&quot;adCountdown&quot;&gt;До награды: 5 сек.&lt;/p&gt;&lt;button id=&quot;adClaim&quot; class=&quot;btn primary&quot; disabled onclick=&quot;finishAd()&quot;&gt;ПОЛУЧИТЬ +25&lt;/button&gt;&lt;/div&gt;`,&#x27;ad&#x27;);busy=true;let left=5;const timer=setInterval(()=&gt;{left--;$(&#x27;#adCountdown&#x27;).textContent=left?`До награды: ${left} сек.`:&#x27;Просмотр завершён&#x27;;if(!left){clearInterval(timer);busy=false;$(&#x27;#adClaim&#x27;).disabled=false;}},1000);}
function finishAd(){if(busy||currentPanel!==&#x27;ad&#x27;||$(&#x27;#adClaim&#x27;).disabled)return;$(&#x27;#adClaim&#x27;).disabled=true;state.coins+=25;state.ads++;save();openModal(&#x27;НАГРАДА ПОЛУЧЕНА&#x27;,&#x27;&lt;h3 class=&quot;success&quot;&gt;+25 монет&lt;/h3&gt;&lt;p&gt;Баланс сохранён.&lt;/p&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;showPanel(\&#x27;cases\&#x27;)&quot;&gt;К КЕЙСАМ&lt;/button&gt;&#x27;,&#x27;result&#x27;);}
function claimEvent(){if(busy||state.event||state.opens&lt;5)return;state.event=true;const won=pick();state.inv.push(item(won));save();openModal(&#x27;WINTER · НАГРАДА&#x27;,`${weapon(won)}&lt;h3&gt;${skins[won][0]} · ${skins[won][1]}&lt;/h3&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;showPanel(&#x27;inventory&#x27;)&quot;&gt;ИНВЕНТАРЬ&lt;/button&gt;`,&#x27;result&#x27;);}
function saveName(){const value=$(&#x27;#nameInput&#x27;).value.trim();if(!value){toastMsg(&#x27;Введи имя&#x27;);return;}state.name=value.slice(0,20);save();toastMsg(&#x27;Имя сохранено&#x27;);}
function saveTicket(){const value=$(&#x27;#supportText&#x27;).value.trim();if(value.length&lt;5){toastMsg(&#x27;Опиши проблему подробнее&#x27;);return;}state.tickets.unshift({id:Date.now().toString(36).toUpperCase(),text:value.slice(0,2000)});save();showPanel(&#x27;support&#x27;);toastMsg(&#x27;Обращение сохранено на устройстве&#x27;);}
function refUrl(){return &#x27;https://htmlpreview.github.io/?https://github.com/sadadafs8-pixel/chatruletk/blob/case-clash-demo/case-clash/index.html&#x27;;}
async function copyRef(){try{await navigator.clipboard.writeText(refUrl());state.refClicks++;save();toastMsg(&#x27;Ссылка на демоверсию скопирована&#x27;);}catch{showPanel(&#x27;refs&#x27;);$(&#x27;#refModal&#x27;).select();toastMsg(&#x27;Выделена ссылка: скопируй её вручную&#x27;);}}
function showSocial(name){openModal(name,`&lt;p&gt;Официальный канал CASE CLASH в ${esc(name)} пока не подключён. Ты можешь поделиться самой демоверсией.&lt;/p&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;copyRef()&quot;&gt;СКОПИРОВАТЬ ССЫЛКУ НА ПРОЕКТ&lt;/button&gt;`,&#x27;social&#x27;);}
function skinInfo(i){openModal(skins[i][0],`${weapon(i)}&lt;h3&gt;${skins[i][1]}&lt;/h3&gt;&lt;p&gt;${fmt(skins[i][3])} очков коллекции&lt;/p&gt;&lt;p class=&quot;notice&quot;&gt;Виртуальный демонстрационный предмет. Рублёвые подписи на главной повторяют референс; реальной продажи и вывода нет.&lt;/p&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;showPanel(&#x27;cases&#x27;)&quot;&gt;ОТКРЫТЬ КЕЙС&lt;/button&gt;`,&#x27;skin&#x27;);}
let battleMode=&#x27;1x1&#x27;;
function showBattle(mode){battleMode=mode;openModal(&#x27;CASE BATTLE&#x27;,`&lt;p&gt;Демо-баттл против ботов · вход 49 монет · баланс ${fmt(state.coins)}&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${[&#x27;1x1&#x27;,&#x27;2x2&#x27;,&#x27;3x3&#x27;].map(m=&gt;`&lt;button class=&quot;btn ${m===mode?&#x27;primary selected&#x27;:&#x27;&#x27;}&quot; onclick=&quot;showBattle(&#x27;${m}&#x27;)&quot;&gt;${m}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p&gt;${mode===&#x27;1x1&#x27;?&#x27;Один игрок против одного&#x27;:mode===&#x27;2x2&#x27;?&#x27;Ты и один бот против двух ботов&#x27;:&#x27;Ты и два бота против трёх ботов&#x27;}. Выигрывает команда с большей суммой очков предметов.&lt;/p&gt;&lt;button id=&quot;battleStart&quot; class=&quot;btn primary&quot; onclick=&quot;startBattle()&quot;&gt;НАЧАТЬ БАТТЛ · 49&lt;/button&gt;&lt;div id=&quot;battleLog&quot;&gt;&lt;/div&gt;&lt;h3&gt;История&lt;/h3&gt;${state.battles.slice(-5).reverse().map(b=&gt;`&lt;div class=&quot;panelCard&quot;&gt;&lt;b&gt;${b.mode} · ${b.a===b.b?&#x27;Ничья&#x27;:b.won?&#x27;Победа&#x27;:&#x27;Поражение&#x27;}&lt;/b&gt;&lt;p&gt;${fmt(b.a)} : ${fmt(b.b)} очков · ${new Date(b.at).toLocaleTimeString(&#x27;ru-RU&#x27;)}&lt;/p&gt;&lt;/div&gt;`).join(&#x27;&#x27;)||&#x27;&lt;p&gt;Пока нет завершённых баттлов.&lt;/p&gt;&#x27;}`,&#x27;battle&#x27;);}
function startBattle(){if(busy||currentPanel!==&#x27;battle&#x27;)return;if(state.coins&lt;49){toastMsg(&#x27;Нужно 49 монет. Пополни демо-баланс в магазине.&#x27;);return;}const n=parseInt(battleMode),left=Array.from({length:n},()=&gt;pick()),right=Array.from({length:n},()=&gt;pick()),a=left.reduce((v,i)=&gt;v+skins[i][3],0),b=right.reduce((v,i)=&gt;v+skins[i][3],0),won=a&gt;b,tie=a===b;state.coins-=49;if(won){state.wins++;state.coins+=98;state.inv.push(item(left[0]));}else if(tie)state.coins+=49;state.battles.push({mode:battleMode,a,b,won,tie,at:Date.now()});save();busy=true;$(&#x27;#battleStart&#x27;).disabled=true;$(&#x27;#battleLog&#x27;).innerHTML=&#x27;&lt;div class=&quot;empty&quot;&gt;Кейсы открываются…&lt;/div&gt;&#x27;;setTimeout(()=&gt;{busy=false;$(&#x27;#battleLog&#x27;).innerHTML=`&lt;div class=&quot;battleSlots&quot;&gt;&lt;div class=&quot;battleResult&quot;&gt;&lt;h3&gt;${esc(state.name)}${n&gt;1?&#x27; + боты&#x27;:&#x27;&#x27;}&lt;/h3&gt;${left.map(weapon).join(&#x27;&#x27;)}&lt;b&gt;${fmt(a)} очков&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;battleResult&quot;&gt;&lt;h3&gt;Команда ботов&lt;/h3&gt;${right.map(weapon).join(&#x27;&#x27;)}&lt;b&gt;${fmt(b)} очков&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3 class=&quot;${won||tie?&#x27;success&#x27;:&#x27;danger&#x27;}&quot;&gt;${won?&#x27;ПОБЕДА · +98 монет и предмет&#x27;:tie?&#x27;НИЧЬЯ · взнос возвращён&#x27;:&#x27;ПОРАЖЕНИЕ&#x27;}&lt;/h3&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;showBattle(&#x27;${battleMode}&#x27;)&quot;&gt;ЕЩЁ БАТТЛ&lt;/button&gt;`;},1800);}
let sheetHistory=[],modalLocation=null,goingBack=false;
function setMobileActive(panel){document.querySelectorAll(&#x27;.mobileNav button&#x27;).forEach(b=&gt;{const active=b.dataset.panel===([&#x27;home&#x27;,&#x27;cases&#x27;,&#x27;battle&#x27;,&#x27;inventory&#x27;].includes(panel)?panel:&#x27;menu&#x27;);b.classList.toggle(&#x27;active&#x27;,active);if(active)b.setAttribute(&#x27;aria-current&#x27;,&#x27;page&#x27;);else b.removeAttribute(&#x27;aria-current&#x27;);});}
function sheetBack(){if(busy){toastMsg(&#x27;Дождись завершения анимации&#x27;);return;}const prev=sheetHistory.pop();if(!prev){closeModal();return;}goingBack=true;if(prev.panel===&#x27;case&#x27;&amp;&amp;prev.case)openCase(prev.case.name,prev.case.price);else if(prev.panel===&#x27;battle&#x27;)showBattle(prev.mode);else if([&#x27;result&#x27;,&#x27;skin&#x27;,&#x27;social&#x27;,&#x27;ad&#x27;].includes(prev.panel))showPanel(&#x27;inventory&#x27;);else showPanel(prev.panel);}
function installMobile(){
 $(&#x27;.top&#x27;).insertAdjacentHTML(&#x27;afterbegin&#x27;,&#x27;&lt;button class=&quot;mobileLogo&quot; aria-label=&quot;На главную&quot; onclick=&quot;showHome()&quot;&gt;&lt;/button&gt;&#x27;);
 document.body.insertAdjacentHTML(&#x27;beforeend&#x27;,`&lt;nav class=&quot;mobileNav&quot; aria-label=&quot;Основная навигация&quot;&gt;${[[&#x27;home&#x27;,&#x27;home&#x27;,&#x27;Главная&#x27;],[&#x27;cases&#x27;,&#x27;case&#x27;,&#x27;Кейсы&#x27;],[&#x27;battle&#x27;,&#x27;battle&#x27;,&#x27;Баттлы&#x27;],[&#x27;inventory&#x27;,&#x27;contract&#x27;,&#x27;Инвентарь&#x27;],[&#x27;menu&#x27;,&#x27;tasks&#x27;,&#x27;Меню&#x27;]].map(([p,i,t])=&gt;`&lt;button data-panel=&quot;${p}&quot; class=&quot;${p===&#x27;home&#x27;?&#x27;active&#x27;:&#x27;&#x27;}&quot; onclick=&quot;${p===&#x27;home&#x27;?&#x27;showHome()&#x27;:`showPanel(&#x27;${p}&#x27;)`}&quot;&gt;${icon(i)}&lt;span&gt;${t}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;`);
 $(&#x27;.modalTop&#x27;).insertAdjacentHTML(&#x27;afterbegin&#x27;,&#x27;&lt;button class=&quot;sheetBack&quot; aria-label=&quot;Назад&quot; onclick=&quot;sheetBack()&quot;&gt;‹&lt;/button&gt;&#x27;);
}
render();
