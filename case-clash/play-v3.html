<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CASE CLASH</title><style>html,body{margin:0;min-height:100%;background:#07080d;color:#eee;font:14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100dvh;display:grid;place-items:center}.boot div{text-align:center}.dot{width:38px;height:38px;margin:0 auto 16px;border:3px solid #2e2f38;border-top-color:#e5bd66;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#817b8a}</style></head><body><div class="boot"><div><div class="dot"></div><b>CASE CLASH</b><br><small>Loading premium build…</small></div></div><script>const api='https://api.github.com/repos/sadadafs8-pixel/chatruletk/contents/';function decode(b64){const bin=atob(b64.replace(/\n/g,'')),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}async function file(path){const r=await fetch(api+path+'?ref=case-clash-demo',{cache:'no-store'});if(!r.ok)throw new Error(path+' '+r.status);const j=await r.json();if(!j.content)throw new Error(path+' has no API content');return decode(j.content)}(async()=>{try{const [html,css]=await Promise.all([file('case-clash/index.html'),file('case-clash/premium-v3.css')]);const out=html.replace('</head>','<style id="case-clash-premium-v3">'+css+'</style></head>');document.open();document.write(out);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="boot"><div><b>Could not load premium build</b><br><small>Refresh the page or use preview-v3.html</small></div></div>'}})();</script></body></html>
